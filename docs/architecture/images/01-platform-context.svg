<text x="440" y="715" class="heading" fill="#19324b" text-anchor="start">Four powers: READ  |  GOVERNED WRITE  |  ACT  |  GOVERN</text>
<text x="32" y="762" class="small" fill="#536b80" text-anchor="start">Guarantee covers declared, qualified paths. Unmanaged credentials, tools and administrators remain explicit trust assumptions.</text>
<text x="32" y="784" class="small" fill="#536b80" text-anchor="start">TARGET ARCHITECTURE • Proposed deployment choices • See architecture-review.md for evidence and limits</text>
