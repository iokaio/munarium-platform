<text x="423" y="144" class="heading" fill="#536b80" text-anchor="start">Qualified platform boundary</text>
<rect x="35" y="170" width="280" height="125" rx="8" fill="#fff" stroke="#7653a2" stroke-width="1.5"/>
<text x="51" y="199" class="heading" fill="#7653a2" text-anchor="start">People</text>
<text x="51" y="224" class="body" fill="#19324b" text-anchor="start">Business approvers</text>
<text x="51" y="246" class="body" fill="#19324b" text-anchor="start">Operators and auditors</text>
<text x="51" y="268" class="body" fill="#19324b" text-anchor="start">Distinct governing authority</text>
<rect x="35" y="440" width="280" height="125" rx="8" fill="#fff" stroke="#2374ab" stroke-width="1.5"/>
<text x="51" y="469" class="heading" fill="#2374ab" text-anchor="start">Agent applications</text>
<text x="51" y="494" class="body" fill="#19324b" text-anchor="start">Harness SDK in the runtime</text>
<text x="51" y="516" class="body" fill="#19324b" text-anchor="start">Scoped workload identity</text>
<text x="51" y="538" class="body" fill="#19324b" text-anchor="start">No direct target credentials</text>
<rect x="435" y="170" width="605" height="100" rx="8" fill="#fff" stroke="#7653a2" stroke-width="1.5"/>
<text x="451" y="199" class="heading" fill="#7653a2" text-anchor="start">Authority</text>
<text x="451" y="224" class="body" fill="#19324b" text-anchor="start">Registry • Warden • Council</text>
<text x="451" y="246" class="body" fill="#19324b" text-anchor="start">Inventory, identity, grants, approval and activation</text>
<rect x="435" y="330" width="605" height="125" rx="8" fill="#fff" stroke="#087f82" stroke-width="1.5"/>
<text x="451" y="359" class="heading" fill="#087f82" text-anchor="start">Mediation</text>
<text x="451" y="384" class="body" fill="#19324b" text-anchor="start">Gate: consequential action • Gateway: model calls</text>
<text x="451" y="406" class="body" fill="#19324b" text-anchor="start">Server: governed memory and accountability</text>
<text x="451" y="428" class="body" fill="#19324b" text-anchor="start">Matrix: governed read-only structured evidence</text>
<rect x="435" y="525" width="605" height="100" rx="8" fill="#fff" stroke="#b56a19" stroke-width="1.5"/>
<text x="451" y="554" class="heading" fill="#b56a19" text-anchor="start">Assurance</text>
<text x="451" y="579" class="body" fill="#19324b" text-anchor="start">Sentinel • Assure • Console</text>
<text x="451" y="601" class="body" fill="#19324b" text-anchor="start">Operational views, portable evidence and human workflows</text>
<rect x="1170" y="165" width="295" height="100" rx="8" fill="#fff" stroke="#536b80" stroke-width="1.5"/>
<text x="1186" y="194" class="heading" fill="#536b80" text-anchor="start">Enterprise sources</text>
<text x="1186" y="219" class="body" fill="#19324b" text-anchor="start">Documents and structured data</text>
<text x="1186" y="241" class="body" fill="#19324b" text-anchor="start">Scoped read access</text>
<rect x="1170" y="345" width="295" height="100" rx="8" fill="#fff" stroke="#536b80" stroke-width="1.5"/>
<text x="1186" y="374" class="heading" fill="#536b80" text-anchor="start">Business targets</text>
<text x="1186" y="399" class="body" fill="#19324b" text-anchor="start">SaaS, release and other tools</text>
<text x="1186" y="421" class="body" fill="#19324b" text-anchor="start">Isolated connectors act here</text>
<rect x="1170" y="525" width="295" height="100" rx="8" fill="#fff" stroke="#536b80" stroke-width="1.5"/>
<text x="1186" y="554" class="heading" fill="#536b80" text-anchor="start">Model providers</text>
<text x="1186" y="579" class="body" fill="#19324b" text-anchor="start">Approved hosted or local routes</text>
<text x="1186" y="601" class="body" fill="#19324b" text-anchor="start">Data disclosure and cost limits</text>
