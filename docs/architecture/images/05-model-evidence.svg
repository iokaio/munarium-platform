<title id="title">Model and evidence paths | Read and disclosure remain governed</title>
<desc id="desc">Agents retrieve scoped Server memory and Matrix query evidence, invoke models through Gateway reservations and disclosure checks, and submit a separately authorized Gate proposal. Assurance reads ledger ranges.</desc>
