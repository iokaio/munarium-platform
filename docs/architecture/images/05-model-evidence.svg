<style>text{font-family:Arial,Helvetica,sans-serif} .title{font-size:29px;font-weight:700} .heading{font-size:19px;font-weight:700} .body{font-size:16px} .small{font-size:14px}</style>
<rect width="1500" height="900" fill="#fff"/>
<text x="32" y="44" class="title" fill="#19324b" text-anchor="start">Model and evidence paths | Read and disclosure remain governed</text>
<text x="32" y="75" class="body" fill="#536b80" text-anchor="start">Model output and retrieved content are inputs to a proposal; neither creates action authority.</text>
<rect x="35" y="160" width="300" height="140" rx="8" fill="#fff" stroke="#2374ab" stroke-width="1.5"/>
<text x="51" y="189" class="heading" fill="#2374ab" text-anchor="start">Agent + Harness</text>
<text x="51" y="214" class="body" fill="#19324b" text-anchor="start">Verified task/root lineage</text>
<text x="51" y="236" class="body" fill="#19324b" text-anchor="start">Build proposal from evidence</text>
<text x="51" y="258" class="body" fill="#19324b" text-anchor="start">Treat model output as untrusted</text>
<rect x="460" y="130" width="435" height="130" rx="8" fill="#fff" stroke="#087f82" stroke-width="1.5"/>
<text x="476" y="159" class="heading" fill="#087f82" text-anchor="start">Server / Matrix</text>
<text x="476" y="184" class="body" fill="#19324b" text-anchor="start">Scoped memory or approved query</text>
<text x="476" y="206" class="body" fill="#19324b" text-anchor="start">Point-in-time evidence + provenance</text>
<text x="476" y="228" class="body" fill="#19324b" text-anchor="start">Current access checked on reuse</text>
<rect x="460" y="365" width="435" height="155" rx="8" fill="#fff" stroke="#087f82" stroke-width="1.5"/>
<text x="476" y="394" class="heading" fill="#087f82" text-anchor="start">Gateway</text>
<text x="476" y="419" class="body" fill="#19324b" text-anchor="start">Check route, destination and data labels</text>
<text x="476" y="441" class="body" fill="#19324b" text-anchor="start">Reserve model-spend capacity</text>
<text x="476" y="463" class="body" fill="#19324b" text-anchor="start">Record required admission facts</text>
<text x="476" y="485" class="body" fill="#19324b" text-anchor="start">Settle usage; unknown cost retains exposure</text>
<rect x="1075" y="370" width="390" height="145" rx="8" fill="#fff" stroke="#536b80" stroke-width="1.5"/>
<text x="1091" y="399" class="heading" fill="#536b80" text-anchor="start">Approved model provider</text>
<text x="1091" y="424" class="body" fill="#19324b" text-anchor="start">Hosted endpoint or local inference</text>
<text x="1091" y="446" class="body" fill="#19324b" text-anchor="start">Streaming / usage / response metadata</text>
<text x="1091" y="468" class="body" fill="#19324b" text-anchor="start">Provider adapter qualification required</text>
<rect x="35" y="590" width="300" height="130" rx="8" fill="#fff" stroke="#087f82" stroke-width="1.5"/>
<text x="51" y="619" class="heading" fill="#087f82" text-anchor="start">Gate action path</text>
<text x="51" y="644" class="body" fill="#19324b" text-anchor="start">Independent action evaluation</text>
<text x="51" y="666" class="body" fill="#19324b" text-anchor="start">Action-capacity reservations</text>
<text x="51" y="688" class="body" fill="#19324b" text-anchor="start">Separate grant + final admission</text>
<rect x="460" y="625" width="435" height="130" rx="8" fill="#fff" stroke="#087f82" stroke-width="1.5"/>
<text x="476" y="654" class="heading" fill="#087f82" text-anchor="start">Server accountability ledger</text>
<text x="476" y="679" class="body" fill="#19324b" text-anchor="start">Producer-owned ordered outboxes</text>
<text x="476" y="701" class="body" fill="#19324b" text-anchor="start">Original facts + correction links</text>
<text x="476" y="723" class="body" fill="#19324b" text-anchor="start">Qualified source ranges / coverage</text>
<rect x="1075" y="625" width="390" height="130" rx="8" fill="#fff" stroke="#b56a19" stroke-width="1.5"/>
<text x="1091" y="654" class="heading" fill="#b56a19" text-anchor="start">Sentinel / Assure / Console</text>
<text x="1091" y="679" class="body" fill="#19324b" text-anchor="start">Authorized views and exports</text>
<text x="1091" y="701" class="body" fill="#19324b" text-anchor="start">Watermarks + explicit omissions</text>
<text x="1091" y="723" class="body" fill="#19324b" text-anchor="start">Offline verifier uses separate trust</text>
