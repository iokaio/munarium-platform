<text x="40" y="815" class="body" fill="#536b80" text-anchor="start">Gate action limits and Gateway model budgets share verified attribution, but have separate balances and transaction owners.</text>
<text x="32" y="862" class="small" fill="#536b80" text-anchor="start">A digest proves content binding, not truth. A read can disclose sensitive data; a hosted model call can itself be consequential.</text>
<text x="32" y="884" class="small" fill="#536b80" text-anchor="start">TARGET ARCHITECTURE • Proposed deployment choices • See architecture-review.md for evidence and limits</text>
