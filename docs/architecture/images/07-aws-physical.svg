<title id="title">AWS physical architecture | Proposed single-region governed cell</title>
<desc id="desc">Proposed AWS deployment separates corporate ingress, isolated agent compute, private platform Kubernetes across zones, connector compute, owner datastores, secrets and an independently retained recovery boundary.</desc>
