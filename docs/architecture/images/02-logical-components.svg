<style>text{font-family:Arial,Helvetica,sans-serif} .title{font-size:29px;font-weight:700} .heading{font-size:19px;font-weight:700} .body{font-size:16px} .small{font-size:14px}</style>
<rect width="1600" height="1070" fill="#fff"/>
<text x="32" y="44" class="title" fill="#19324b" text-anchor="start">Logical architecture | Four planes, eleven components</text>
<text x="32" y="75" class="body" fill="#536b80" text-anchor="start">Component ownership is distinct from process count. Harness is an SDK; the hub is documentation, contracts and evidence.</text>
<rect x="30" y="120" width="310" height="225" rx="12" fill="#edf4fb" stroke="#2374ab" stroke-width="1.5"/>
<text x="48" y="149" class="heading" fill="#2374ab" text-anchor="start">AGENT PLANE</text>
<rect x="425" y="120" width="515" height="695" rx="12" fill="#e9f7f5" stroke="#087f82" stroke-width="1.5"/>
<text x="443" y="149" class="heading" fill="#087f82" text-anchor="start">MEDIATION PLANE</text>
<rect x="1025" y="120" width="545" height="695" rx="12" fill="#f2edf9" stroke="#7653a2" stroke-width="1.5"/>
<text x="1043" y="149" class="heading" fill="#7653a2" text-anchor="start">AUTHORITY PLANE</text>
<rect x="50" y="175" width="270" height="135" rx="8" fill="#fff" stroke="#2374ab" stroke-width="1.5"/>
<text x="66" y="204" class="heading" fill="#2374ab" text-anchor="start">Application + Harness</text>
<text x="66" y="229" class="body" fill="#19324b" text-anchor="start">Build stable proposals</text>
<text x="66" y="251" class="body" fill="#19324b" text-anchor="start">Bind verified task lineage</text>
<text x="66" y="273" class="body" fill="#19324b" text-anchor="start">Look up typed outcomes</text>
<text x="66" y="295" class="body" fill="#19324b" text-anchor="start">SDK carries no enforcement</text>
<rect x="30" y="455" width="310" height="180" rx="12" fill="#e9f7f5" stroke="#087f82" stroke-width="1.5" stroke-dasharray="8 5"/>
<text x="48" y="484" class="heading" fill="#087f82" text-anchor="start">CONNECTOR DOMAIN</text>
<rect x="50" y="505" width="270" height="110" rx="8" fill="#fff" stroke="#087f82" stroke-width="1.5"/>
<text x="66" y="534" class="heading" fill="#087f82" text-anchor="start">Isolated connector</text>
<text x="66" y="559" class="body" fill="#19324b" text-anchor="start">Own privilege domain</text>
<text x="66" y="581" class="body" fill="#19324b" text-anchor="start">Bound live invocation</text>
<text x="66" y="603" class="body" fill="#19324b" text-anchor="start">Target-only narrow egress</text>
<rect x="50" y="690" width="270" height="90" rx="8" fill="#fff" stroke="#536b80" stroke-width="1.5"/>
<text x="66" y="719" class="heading" fill="#536b80" text-anchor="start">Target system</text>
<text x="66" y="744" class="body" fill="#19324b" text-anchor="start">Effect key + precondition</text>
<text x="66" y="766" class="body" fill="#19324b" text-anchor="start">Supported recovery fence</text>
<rect x="445" y="175" width="475" height="115" rx="8" fill="#fff" stroke="#087f82" stroke-width="1.5"/>
<text x="461" y="204" class="heading" fill="#087f82" text-anchor="start">Gate</text>
<text x="461" y="229" class="body" fill="#19324b" text-anchor="start">Policy and exact-request admission</text>
<text x="461" y="251" class="body" fill="#19324b" text-anchor="start">Claims, reservations, final-send journal</text>
<rect x="445" y="330" width="475" height="115" rx="8" fill="#fff" stroke="#087f82" stroke-width="1.5"/>
<text x="461" y="359" class="heading" fill="#087f82" text-anchor="start">Gateway</text>
<text x="461" y="384" class="body" fill="#19324b" text-anchor="start">Model routes and disclosure checks</text>
<text x="461" y="406" class="body" fill="#19324b" text-anchor="start">Model-spend reservations and settlement</text>
<rect x="445" y="485" width="475" height="115" rx="8" fill="#fff" stroke="#087f82" stroke-width="1.5"/>
<text x="461" y="514" class="heading" fill="#087f82" text-anchor="start">Server</text>
<text x="461" y="539" class="body" fill="#19324b" text-anchor="start">Governed memory and protected action records</text>
<text x="461" y="561" class="body" fill="#19324b" text-anchor="start">Authoritative append-only accountability</text>
<rect x="445" y="640" width="475" height="115" rx="8" fill="#fff" stroke="#087f82" stroke-width="1.5"/>
<text x="461" y="669" class="heading" fill="#087f82" text-anchor="start">Matrix</text>
<text x="461" y="694" class="body" fill="#19324b" text-anchor="start">Approved read-only query contracts</text>
<text x="461" y="716" class="body" fill="#19324b" text-anchor="start">Typed evidence, source scope and provenance</text>
<rect x="1045" y="175" width="505" height="115" rx="8" fill="#fff" stroke="#7653a2" stroke-width="1.5"/>
<text x="1061" y="204" class="heading" fill="#7653a2" text-anchor="start">Registry</text>
<text x="1061" y="229" class="body" fill="#19324b" text-anchor="start">Signed manifests and inert candidates</text>
<text x="1061" y="251" class="body" fill="#19324b" text-anchor="start">Immutable artifacts + activation pointers</text>
<rect x="1045" y="365" width="505" height="115" rx="8" fill="#fff" stroke="#7653a2" stroke-width="1.5"/>
<text x="1061" y="394" class="heading" fill="#7653a2" text-anchor="start">Warden</text>
<text x="1061" y="419" class="body" fill="#19324b" text-anchor="start">Verified principal/delegation and narrow grants</text>
<text x="1061" y="441" class="body" fill="#19324b" text-anchor="start">Credential custody, revocation and suspension</text>
<rect x="1045" y="555" width="505" height="115" rx="8" fill="#fff" stroke="#7653a2" stroke-width="1.5"/>
<text x="1061" y="584" class="heading" fill="#7653a2" text-anchor="start">Council</text>
<text x="1061" y="609" class="body" fill="#19324b" text-anchor="start">Exact approvals and distinct human authority</text>
<text x="1061" y="631" class="body" fill="#19324b" text-anchor="start">Ratification + activation coordination</text>
