<text x="984" y="580" class="small" fill="#7653a2" text-anchor="middle">approval</text>
<rect x="30" y="845" width="1540" height="145" rx="12" fill="#fff5e6" stroke="#b56a19" stroke-width="1.5"/>
<text x="48" y="874" class="heading" fill="#b56a19" text-anchor="start">ASSURANCE PLANE | authorized records and governed operator APIs</text>
<rect x="50" y="892" width="460" height="77" rx="8" fill="#fff" stroke="#b56a19" stroke-width="1.5"/>
<text x="66" y="921" class="heading" fill="#b56a19" text-anchor="start">Sentinel</text>
<text x="66" y="946" class="body" fill="#19324b" text-anchor="start">Rebuildable timelines + bounded suspension</text>
<rect x="550" y="892" width="470" height="77" rx="8" fill="#fff" stroke="#b56a19" stroke-width="1.5"/>
<text x="566" y="921" class="heading" fill="#b56a19" text-anchor="start">Assure</text>
<text x="566" y="946" class="body" fill="#19324b" text-anchor="start">Evidence packages + offline integrity verification</text>
<rect x="1060" y="892" width="490" height="77" rx="8" fill="#fff" stroke="#b56a19" stroke-width="1.5"/>
<text x="1076" y="921" class="heading" fill="#b56a19" text-anchor="start">Console</text>
<text x="1076" y="946" class="body" fill="#19324b" text-anchor="start">Human views + Council/Warden service calls</text>
<text x="32" y="1032" class="small" fill="#536b80" text-anchor="start">Selected dependencies shown. Each state owner writes only its own store; all authoritative producers retain ordered Server outboxes.</text>
<text x="32" y="1054" class="small" fill="#536b80" text-anchor="start">TARGET ARCHITECTURE • Proposed deployment choices • See architecture-review.md for evidence and limits</text>
