<title id="title">Logical architecture | Four planes, eleven components</title>
<desc id="desc">Four planes contain Harness; Gate, Gateway, Server and Matrix; Registry, Warden and Council; Sentinel, Assure and Console. A connector alone sends target mutations.</desc>
