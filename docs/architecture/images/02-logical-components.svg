<text x="982.5" y="210.0" class="small" fill="#7653a2" text-anchor="middle">manifest</text>
<polyline points="920,240 975,240 975,415 1045,415" fill="none" stroke="#7653a2" stroke-width="2" marker-end="url(#arrow7653a2)"/>
<rect x="909.0" y="335" width="136.0" height="21" rx="3" fill="#fff"/>
<text x="977" y="350" class="small" fill="#7653a2" text-anchor="middle">identity / grant</text>
<polyline points="920,265 955,265 955,605 1045,605" fill="none" stroke="#7653a2" stroke-width="2" marker-end="url(#arrow7653a2)"/>
