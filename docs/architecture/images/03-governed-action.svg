<title id="title">Governed action | From proposal to a known or unresolved effect</title>
<desc id="desc">Sequence across agent, Gate journal, authority services, Server, connector and target. Durable claim, grant consumption and predispatch acknowledgement precede one live final admission.</desc>
<defs>
<marker id="arrow19324b" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#19324b"/></marker>
