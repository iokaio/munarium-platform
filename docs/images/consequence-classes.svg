   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f3a5f" x="468" y="34.136484" transform="rotate(-0 468 34.136484)">CONSEQUENCE CLASSES AND DEFAULT POSTURES</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="57.6" y="94.723828" transform="rotate(-0 57.6 94.723828)">C0</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f3a5f" x="100.8" y="94.261719" transform="rotate(-0 100.8 94.261719)">Bounded observation</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1c2a3a" x="331.2" y="93.065469" transform="rotate(-0 331.2 93.065469)">no restricted disclosure or target mutation</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #2f6b4f" x="892.8" y="93.032266" transform="rotate(-0 892.8 93.032266)">scoped authorization and the declared record policy</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="57.6" y="139.363828" transform="rotate(-0 57.6 139.363828)">C1</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f3a5f" x="100.8" y="137.944297" transform="rotate(-0 100.8 137.944297)">Internal, bounded, ordinarily reversible</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1c2a3a" x="331.2" y="137.705469" transform="rotate(-0 331.2 137.705469)">change inside the deployment</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #2f6b4f" x="892.8" y="137.705469" transform="rotate(-0 892.8 137.705469)">deterministic allow with limits and a receipt</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="57.6" y="184.003828" transform="rotate(-0 57.6 184.003828)">C2</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f3a5f" x="100.8" y="183.541719" transform="rotate(-0 100.8 183.541719)">Bounded external effect</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1c2a3a" x="331.2" y="182.345469" transform="rotate(-0 331.2 182.345469)">or a more consequential internal change</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #a8863b" transform="translate(657.8175 176.574766)">verified arguments, scope and cumulative limits,</text>
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #a8863b" transform="translate(752.72 188.082969)">required provenance, receipt</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="57.6" y="228.643828" transform="rotate(-0 57.6 228.643828)">C3</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f3a5f" x="100.8" y="227.224297" transform="rotate(-0 100.8 227.224297)">Irreversible, sensitive, regulated</text>
   </g>
   <g id="text_16">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1c2a3a" x="331.2" y="226.985469" transform="rotate(-0 331.2 226.985469)">or production-critical effect</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #8f3a3a" transform="translate(706.300703 221.214766)">explicit distinct authority and satisfied</text>
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #8f3a3a" transform="translate(755.069453 232.689766)">obligations before execution</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="57.6" y="273.283828" transform="rotate(-0 57.6 273.283828)">C4</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f3a5f" x="100.8" y="272.821719" transform="rotate(-0 100.8 272.821719)">Prohibited</text>
   </g>
   <g id="text_20">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1c2a3a" x="331.2" y="271.625469" transform="rotate(-0 331.2 271.625469)">for the requesting principal or deployment</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #8f3a3a" x="892.8" y="271.625469" transform="rotate(-0 892.8 271.625469)">no reachable authorized execution path</text>
   </g>
   <g id="text_22">
    <text style="font-style: italic; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #5b6773" transform="translate(168.543688 313.797687)">A class is computed from the approved manifest and verified context; an agent's description of an action as harmless does not lower it. Modifiers</text>
    <text style="font-style: italic; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #5b6773" transform="translate(165.199625 324.867687)">raise the base class; they never quietly downgrade it. A read can disclose sensitive data and is not automatically C0. Policy also carries cumulative</text>
    <text style="font-style: italic; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #5b6773" transform="translate(455.543047 336.732062)">limits.</text>
   </g>
  </g>
 </g>
