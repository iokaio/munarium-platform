   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f3a5f" x="468" y="34.136484" transform="rotate(-0 468 34.136484)">THREE DEPLOYMENT PROFILES</text>
   </g>
   <g id="text_2">
    <text style="font-style: italic; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #5b6773" x="468" y="58.628145" transform="rotate(-0 468 58.628145)">Shared authority semantics; each profile requires its own qualification</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="171" y="101.559844" transform="rotate(-0 171 101.559844)">LOCAL DEVELOPMENT</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1c2a3a" x="41.76" y="132.738063" transform="rotate(-0 41.76 132.738063)">• reproducible container-based stack</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1c2a3a" x="41.76" y="155.778063" transform="rotate(-0 41.76 155.778063)">• test identity provider and test broker</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(41.76 178.818062)">• Server, selected components, a disposable</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(41.76 190.180141)">target</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(41.76 219.138062)">• for development and conformance, not a</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(41.76 230.748062)">disguised production appliance</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="469.8" y="101.559844" transform="rotate(-0 469.8 101.559844)">SINGLE-CELL REFERENCE</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1c2a3a" x="340.56" y="132.738063" transform="rotate(-0 340.56 132.738063)">• one actual trust boundary</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(340.56 155.778063)">• separate service identities, durable</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(340.56 167.312141)">PostgreSQL</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(340.56 196.098062)">• authenticated channels, controlled egress,</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(340.56 207.708062)">backups, defined recovery</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(340.56 236.418063)">• virtual machines or a supported container</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(340.56 248.028063)">platform; Kubernetes is not a conceptual</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(340.56 259.638062)">prerequisite</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="768.6" y="100.920781" transform="rotate(-0 768.6 100.920781)">CLOUD, ON-PREMISES, AIR-GAPPED</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1c2a3a" x="639.36" y="132.738063" transform="rotate(-0 639.36 132.738063)">• recipes sharing the same authority semantics</text>
   </g>
   <g id="text_15">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1c2a3a" x="639.36" y="155.778063" transform="rotate(-0 639.36 155.778063)">• own qualification for each</text>
   </g>
   <g id="text_16">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(639.36 178.818062)">• offline: local identity, keys, artifacts,</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(639.36 190.428062)">models, time handling, update and</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(639.36 202.038062)">vulnerability import</text>
   </g>
   <g id="text_17">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(639.36 236.418062)">• a diagram saying no outbound dependency is</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(639.36 248.028062)">not proof</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1f3a5f" transform="translate(105.367563 320.534469)">Degraded modes are published per dependency: Council unavailable means no new approval or activation; Warden unavailable means no new grant;</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1f3a5f" transform="translate(155.39 332.144469)">the mandatory journal unavailable means no new consequential dispatch; Sentinel unavailable leaves local hard controls active.</text>
   </g>
  </g>
 </g>
