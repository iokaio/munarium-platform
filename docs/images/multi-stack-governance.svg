   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f3a5f" x="468" y="34.136484" transform="rotate(-0 468 34.136484)">ONE AUTHORITY MODEL, MANY ENTERPRISE STACKS</text>
   </g>
   <g id="text_2">
    <text style="font-style: italic; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #5b6773" x="468" y="58.628145" transform="rotate(-0 468 58.628145)">Target profiles, not assertions that the components already integrate with the named products</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="112.32" y="101.559844" transform="rotate(-0 112.32 101.559844)">MICROSOFT-CENTERED</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a8863b" x="41.76" y="130.192383" transform="rotate(-0 41.76 130.192383)">TARGETS</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(41.76 144.217312)">Entra ID, Key Vault, Azure-</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(41.76 155.105016)">hosted models, Microsoft 365,</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(41.76 165.585656)">SQL Server or Fabric, Teams,</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(41.76 176.165016)">ServiceNow, Sentinel</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a8863b" x="41.76" y="223.298438" transform="rotate(-0 41.76 223.298438)">INITIAL QUALIFICATION</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(41.76 237.817313)">one identity path, one model</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(41.76 248.347313)">route, one approval surface,</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(41.76 259.632938)">one narrow action</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="292.32" y="101.559844" transform="rotate(-0 292.32 101.559844)">AWS-CENTERED</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a8863b" x="221.76" y="130.192383" transform="rotate(-0 221.76 130.192383)">TARGETS</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(221.76 144.217312)">IAM identity, EKS or VM</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(221.76 155.105016)">workloads, KMS and Secrets</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(221.76 165.277312)">Manager, Bedrock, CloudWatch,</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(221.76 175.837781)">Jira or Slack</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a8863b" x="221.76" y="223.298438" transform="rotate(-0 221.76 223.298438)">INITIAL QUALIFICATION</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(221.76 238.572937)">workload and broker boundaries</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(221.76 249.102937)">inside a declared VPC</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="472.32" y="101.559844" transform="rotate(-0 472.32 101.559844)">GOOGLE-CENTERED</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a8863b" x="401.76" y="130.192383" transform="rotate(-0 401.76 130.192383)">TARGETS</text>
   </g>
   <g id="text_15">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(401.76 144.217312)">Cloud Identity, GKE or VM</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(401.76 154.747312)">workloads, Secret Manager,</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(401.76 165.277312)">Vertex AI, BigQuery, Google</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(401.76 175.807312)">SecOps, Chat</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a8863b" x="401.76" y="223.298438" transform="rotate(-0 401.76 223.298438)">INITIAL QUALIFICATION</text>
   </g>
   <g id="text_17">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(401.76 237.817313)">a compatibility profile with</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(401.76 248.705016)">the same contracts, not a</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(401.76 258.877313)">separate authority model</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="652.32" y="101.166875" transform="rotate(-0 652.32 101.166875)">OPEN / ON-PREMISES</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a8863b" x="581.76" y="130.192383" transform="rotate(-0 581.76 130.192383)">TARGETS</text>
   </g>
   <g id="text_20">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(581.76 144.217312)">Keycloak or another IdP, Vault</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(581.76 154.747312)">or a qualified broker,</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(581.76 165.277312)">PostgreSQL, local models,</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(581.76 175.807312)">Linux containers, OpenShift</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(581.76 187.092938)">where needed</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a8863b" x="581.76" y="223.298438" transform="rotate(-0 581.76 223.298438)">INITIAL QUALIFICATION</text>
   </g>
   <g id="text_22">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(581.76 237.817313)">the reproducible local stack</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(581.76 249.102937)">first</text>
   </g>
   <g id="text_23">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="832.32" y="101.559844" transform="rotate(-0 832.32 101.559844)">MIXED LEGACY</text>
   </g>
   <g id="text_24">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a8863b" x="761.76" y="130.192383" transform="rotate(-0 761.76 130.192383)">TARGETS</text>
   </g>
   <g id="text_25">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(761.76 144.217312)">Multiple identity domains,</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(761.76 154.627266)">VMs, ERP, API gateways, RPA,</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(761.76 165.277312)">mainframe-facing APIs, cloud</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(761.76 176.562937)">and local models</text>
   </g>
   <g id="text_26">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a8863b" x="761.76" y="223.298438" transform="rotate(-0 761.76 223.298438)">INITIAL QUALIFICATION</text>
   </g>
   <g id="text_27">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(761.76 237.817313)">a governed boundary around a</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(761.76 248.347313)">few high-value operations; no</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(761.76 258.877313)">big-bang migration</text>
   </g>
   <g id="text_28">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #1f3a5f" transform="translate(101.042461 330.971797)">The first-year baseline qualifies a local reference stack and one sponsor- or adopter-backed enterprise profile. Qualification of one stack</text>
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #1f3a5f" transform="translate(342.341719 343.796797)">does not establish qualification of every stack.</text>
   </g>
  </g>
 </g>
