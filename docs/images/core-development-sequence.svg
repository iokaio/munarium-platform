   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f3a5f" x="468" y="34.136484" transform="rotate(-0 468 34.136484)">THE DEVELOPMENT METHOD · BOUNDED CODING AGENTS</text>
   </g>
   <g id="text_2">
    <text style="font-style: italic; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #5b6773" x="468" y="58.628145" transform="rotate(-0 468 58.628145)">The founder controls acceptance and release; coding agents produce bounded work and evidence, not authority</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="97.92" y="101.565313" transform="rotate(-0 97.92 101.565313)">1 · DEFINE</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(41.76 132.738063)">The founder sets scope,</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(41.76 144.348062)">constraints, permitted</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(41.76 155.958063)">files, acceptance tests</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(41.76 168.401187)">and a cost limit.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="246.24" y="101.559844" transform="rotate(-0 246.24 101.559844)">2 · DELEGATE</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(190.08 133.132453)">VCP, Claude Code, Codex</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(190.08 144.348062)">or another agent works</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(190.08 156.791188)">in a bounded checkout.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="394.56" y="101.559844" transform="rotate(-0 394.56 101.559844)">3 · VERIFY</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(338.4 133.571188)">Executed checks retain</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(338.4 144.742453)">commands, exit status,</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(338.4 155.958062)">results and findings.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="542.88" y="101.565313" transform="rotate(-0 542.88 101.565313)">4 · REVIEW</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(486.72 132.738063)">The founder inspects the</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(486.72 144.348062)">change; other models</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(486.72 155.958063)">remain advisory.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="691.2" y="101.559844" transform="rotate(-0 691.2 101.559844)">5 · AUTHORIZE</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(635.04 133.571188)">Protected controls admit</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(635.04 144.348062)">the exact approved</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(635.04 156.791187)">revision.</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="839.52" y="101.559844" transform="rotate(-0 839.52 101.559844)">6 · RELEASE</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(783.36 132.738063)">A pinned composition</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(783.36 145.181187)">links artifacts and</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(783.36 155.958063)">qualification evidence.</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #1f3a5f" transform="translate(98.789922 267.971797)">No coding agent may publish a release or rewrite its active control baseline. A second model's review is additional analysis, not a second</text>
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #1f3a5f" transform="translate(413.516758 280.833906)">accountable person.</text>
   </g>
  </g>
 </g>
