   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f3a5f" x="468" y="34.136484" transform="rotate(-0 468 34.136484)">WHERE THE GUARANTEE ENDS</text>
   </g>
   <g id="text_2">
    <text style="font-style: italic; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #5b6773" x="468" y="58.628145" transform="rotate(-0 468 58.628145)">Within a qualified deployment, the specified consequential path is mediated; nothing is claimed beyond it</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f3a5f" x="151.2" y="103.989844" transform="rotate(-0 151.2 103.989844)">AGENT PLANE</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(41.76 126.882969)">Untrusted reasoning and proposals.</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(41.76 138.357969)">Cannot acquire, through the mediated</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(41.76 149.832969)">path, authority the deployed</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(41.76 161.307969)">controls deny.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f3a5f" x="468" y="103.33125" transform="rotate(-0 468 103.33125)">QUALIFIED MEDIATION BOUNDARY</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(315.36 126.882969)">Gate, Gateway, Server, Matrix, with Registry, Warden</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(315.36 138.357969)">and Council behind them. The control-boundary record</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(315.36 149.832969)">names the systems, identities, networks, tools and</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(315.36 161.307969)">administrative roles included in qualification.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f3a5f" x="784.8" y="103.989844" transform="rotate(-0 784.8 103.989844)">TARGETS</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(675.36 126.882969)">The declared, connector-qualified</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(675.36 138.357969)">operations. Downstream effects and</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(675.36 149.832969)">destinations are part of the</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(675.36 160.458633)">consequence.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8f3a3a" x="43.2" y="236.528164" transform="rotate(-0 43.2 236.528164)">OUTSIDE THE BOUNDARY, AND THEREFORE OUTSIDE THE CLAIM</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(43.2 254.037688)">A separate credential · an unmanaged host · an unprotected approval pipeline · a target-side rule outside the tested boundary. Discovery and tests</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(43.2 265.107687)">locate gaps; they do not prove every bypass eliminated. Assure exports the boundary with the evidence; silence about untested paths would make the</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(43.2 276.177687)">assurance misleading.</text>
   </g>
  </g>
 </g>
