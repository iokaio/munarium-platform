   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f3a5f" x="468" y="34.136484" transform="rotate(-0 468 34.136484)">FEDERATION · LATER OPEN WORK</text>
   </g>
   <g id="text_2">
    <text style="font-style: italic; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #5b6773" x="468" y="58.628145" transform="rotate(-0 468 58.628145)">Signed intent is distributed; local authority, evidence and non-waivable constraints stay local</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f3a5f" x="468" y="107.120313" transform="rotate(-0 468 107.120313)">ENTERPRISE AUTHORITY · signed minimum policy + explicit delegation</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f3a5f" x="237.6" y="190.389844" transform="rotate(-0 237.6 190.389844)">REGIONAL CELL A</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(79.2 213.971813)">Local Gate, Warden and Council</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(79.2 226.30075)">Local Server evidence and retention</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(79.2 237.32825)">Regional restrictions; local keys and secrets</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f3a5f" x="698.4" y="190.389844" transform="rotate(-0 698.4 190.389844)">REGIONAL CELL B</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(540 213.971813)">Local Gate, Warden and Council</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(540 226.30075)">Local Server evidence and retention</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(540 237.32825)">Regional restrictions; local keys and secrets</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1f3a5f" transform="translate(137.446906 309.768062)">A cross-domain proposal needs source-side permission to release and destination-side permission to execute. If either required domain</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1f3a5f" transform="translate(379.023594 321.378062)">denies, the action does not proceed.</text>
   </g>
   <g id="text_9">
    <text style="font-style: italic; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #5b6773" transform="translate(175.37275 356.997687)">A local authority can add restrictions; it cannot remove a mandatory parent prohibition or widen a nondelegable maximum. Shared assurance</text>
    <text style="font-style: italic; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #5b6773" transform="translate(344.705312 368.067687)">need not include raw prompts, customer records or secrets.</text>
   </g>
