   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f3a5f" x="468" y="34.136484" transform="rotate(-0 468 34.136484)">SIX PROJECTED ENTERPRISE USES</text>
   </g>
   <g id="text_2">
    <text style="font-style: italic; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #5b6773" x="468" y="58.628145" transform="rotate(-0 468 58.628145)">Projected examples, not customer claims; each starts small and states the limit that keeps a demonstration from being mistaken for enterprise-wide governance</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="37.44" y="99.683437" transform="rotate(-0 37.44 99.683437)">Enterprise</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="203.04" y="99.648281" transform="rotate(-0 203.04 99.648281)">Entry point</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="433.44" y="99.648281" transform="rotate(-0 433.44 99.648281)">Consequential boundary</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="685.44" y="100.555313" transform="rotate(-0 685.44 100.555313)">Stated limit</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f3a5f" x="37.44" y="138.147438" transform="rotate(-0 37.44 138.147438)">Software organization</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(203.04 133.047125)">Coding agent prepares a patch and a release</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(203.04 143.307125)">proposal</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(433.44 133.047125)">Publishing and deployment capability brokered by</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(433.44 143.307125)">Warden; release freeze is a governed input</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(685.44 133.047125)">Disposable repository first; does not prove</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(685.44 143.307125)">every laptop or CI system is governed</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f3a5f" x="37.44" y="185.667438" transform="rotate(-0 37.44 185.667438)">Regional bank</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1c2a3a" x="203.04" y="185.697125" transform="rotate(-0 203.04 185.697125)">Vendor-master update from invoice evidence</text>
   </g>
   <g id="text_13">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(433.44 180.567125)">Payment remains a separate C3 capability; new</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(433.44 190.827125)">account verified through a trusted channel</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(685.44 180.567125)">Bank supplies approver roles and test</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(685.44 191.563375)">environment</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f3a5f" x="37.44" y="233.953375" transform="rotate(-0 37.44 233.953375)">Healthcare network</text>
   </g>
   <g id="text_16">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1c2a3a" x="203.04" y="233.217125" transform="rotate(-0 203.04 233.217125)">Administrative scheduling and drafted messages</text>
   </g>
   <g id="text_17">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(433.44 228.087125)">Recipient, channel, classification and consent</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(433.44 238.347125)">checked by a narrow connector</text>
   </g>
   <g id="text_18">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(685.44 228.087125)">Synthetic records; no clinical or legal judgment</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(685.44 238.347125)">by the platform</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f3a5f" x="37.44" y="281.473375" transform="rotate(-0 37.44 281.473375)">Manufacturer</text>
   </g>
   <g id="text_20">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(203.04 275.607125)">Maintenance work order from approved plant</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(203.04 286.603375)">documents</text>
   </g>
   <g id="text_21">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(433.44 275.607125)">Bounded CMMS request; direct machine control</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(433.44 285.867125)">prohibited</text>
   </g>
   <g id="text_22">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(685.44 275.607125)">Offline profile tested, not assumed; not a</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(685.44 285.867125)">safety interlock</text>
   </g>
   <g id="text_23">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f3a5f" x="37.44" y="328.993375" transform="rotate(-0 37.44 328.993375)">Law firm</text>
   </g>
   <g id="text_24">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1c2a3a" x="203.04" y="328.257125" transform="rotate(-0 203.04 328.257125)">Matter-scoped research and filing package</text>
   </g>
   <g id="text_25">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(433.44 323.127125)">Digests, matter, destination and approver bound; a</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(433.44 333.387125)">later edit invalidates approval</text>
   </g>
   <g id="text_26">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(685.44 323.127125)">Simulated filing endpoint; no legal validation</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(685.44 334.123375)">of content</text>
   </g>
   <g id="text_27">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f3a5f" x="37.44" y="376.396406" transform="rotate(-0 37.44 376.396406)">Insurer</text>
   </g>
   <g id="text_28">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1c2a3a" x="203.04" y="376.513375" transform="rotate(-0 203.04 376.513375)">Claim recommendation with cited records</text>
   </g>
   <g id="text_29">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(433.44 370.647125)">Disbursement separate, with thresholds, cumulative</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(433.44 380.907125)">controls and bound approval</text>
   </g>
   <g id="text_30">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(685.44 370.647125)">Authority path evaluated separately from</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(685.44 380.907125)">recommendation accuracy</text>
   </g>
   <g id="text_31">
    <text style="font-style: italic; font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #5b6773" x="468" y="414.597688" transform="rotate(-0 468 414.597688)">Outreach target: six technically relevant evaluations in the first year, no more than two active high-touch design partners at once.</text>
   </g>
  </g>
