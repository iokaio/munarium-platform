   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f3a5f" x="468" y="34.136484" transform="rotate(-0 468 34.136484)">PROPOSING A GOVERNANCE CHANGE IS NOT ACTIVATING GOVERNANCE</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="171" y="94.359844" transform="rotate(-0 171 94.359844)">PROPOSE</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(41.76 125.538062)">An agent or a human submits an inert candidate</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(41.76 137.148062)">through a narrow intake surface.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a8863b" x="41.76" y="213.249766" transform="rotate(-0 41.76 213.249766)">Any principal</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="469.8" y="94.365312" transform="rotate(-0 469.8 94.365312)">RATIFY</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(340.56 125.538062)">A distinct authority verifies approver, role,</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(340.56 137.148062)">binding, freshness and quorum. Never the</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(340.56 148.758062)">proposer, never an agent-derived identity.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a8863b" x="340.56" y="214.106406" transform="rotate(-0 340.56 214.106406)">Council</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="768.6" y="94.359844" transform="rotate(-0 768.6 94.359844)">ACTIVATE</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(639.36 125.538062)">A compare-and-set transition makes the artifact</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(639.36 137.542453)">effective; the old artifact remains for</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(639.36 149.591187)">reconstruction.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a8863b" x="639.36" y="213.249766" transform="rotate(-0 639.36 213.249766)">Council → Registry · Server</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #1f3a5f" transform="translate(86.673711 266.171797)">A governed writer does not inherit authority to change the rules governing its writes. Before Council exists, an owner-provisioned, non-agent</text>
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #1f3a5f" transform="translate(279.714453 279.033906)">bootstrap attestation with a recorded retirement path takes its place.</text>
   </g>
  </g>
