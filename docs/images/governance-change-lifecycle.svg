    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(692.666766 170.587312)">digest pinned</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="850.32" y="103.887949" transform="rotate(-0 850.32 103.887949)">Observe</text>
   </g>
   <g id="text_21">
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="850.32" y="123.398438" transform="rotate(-0 850.32 123.398438)">Sentinel</text>
   </g>
   <g id="text_22">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(813.486141 160.415016)">drift vs shadow;</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(815.412984 171.342937)">rollback = new</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(825.244641 181.872937)">activation</text>
   </g>
   <g id="text_23">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #8f3a3a" x="243" y="223.593906" transform="rotate(-0 243 223.593906)">Separation of duties is structural</text>
   </g>
   <g id="text_24">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(43.2 241.797687)">A principal cannot ratify a proposal that policy identifies as its own, and an</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(43.2 252.867687)">agent-derived identity cannot become the ratifier by delegating through</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(43.2 263.937687)">another service. A deterministic pipeline may approve only permitted change</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(43.2 275.802062)">classes.</text>
   </g>
   <g id="text_25">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f3a5f" x="693" y="223.556797" transform="rotate(-0 693 223.556797)">Nothing is edited in place</text>
   </g>
   <g id="text_26">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(493.2 241.797687)">The active bundle is never modified; rollback activates a known prior digest</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(493.2 252.867687)">within a bounded, pre-authorized scope. Cancellation, expiry, veto and failed</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(493.2 263.937687)">activation are first-class outcomes. A policy that weakens enforcement is</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(493.2 275.007687)">itself a governance change.</text>
   </g>
  </g>
