   </g>
   <g id="text_18">
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="725.04" y="123.398438" transform="rotate(-0 725.04 123.398438)">Registry + Server</text>
   </g>
   <g id="text_19">
