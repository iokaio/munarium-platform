   <g id="text_27">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #1f3a5f" transform="translate(122.666 235.313875)">Conformance-tested, not certified, unless a named independent process justifies the stronger term. Permission drift or an untested target</text>
