   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f3a5f" x="468" y="34.136484" transform="rotate(-0 468 34.136484)">THE EXECUTION STATE MACHINE</text>
   </g>
   <g id="text_2">
    <text style="font-style: italic; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #5b6773" x="468" y="58.628145" transform="rotate(-0 468 58.628145)">A retry with the same operation identity and different canonical content is a conflict; an unresolved record never expires into permission</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f3a5f" x="115.2" y="182.798438" transform="rotate(-0 115.2 182.798438)">Proposed</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1c2a3a" x="115.2" y="202.876938" transform="rotate(-0 115.2 202.876938)">authenticated request captured</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f3a5f" x="295.2" y="104.470313" transform="rotate(-0 295.2 104.470313)">Denied</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(249.552406 123.676938)">no execution; a changed</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(242.276703 133.666938)">proposal is a new evaluation</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f3a5f" x="295.2" y="261.998438" transform="rotate(-0 295.2 261.998438)">Approval required</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(248.0805 282.076937)">wait, expire, withdraw, or</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(248.077609 292.066937)">receive a bound approval</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f3a5f" x="475.2" y="183.670313" transform="rotate(-0 475.2 183.670313)">Authorized and claimed</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(433.351844 203.216297)">decision valid; durable</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(434.120172 213.583813)">execution claim exists</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f3a5f" x="655.2" y="182.763281" transform="rotate(-0 655.2 182.763281)">Dispatching</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(598.001469 203.593813)">a worker owns the claim under</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(626.793828 212.866938)">a fencing value</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f3a5f" x="835.2" y="103.598438" transform="rotate(-0 835.2 103.598438)">Completed</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(784.442937 123.676938)">outcome known; replay the</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(784.949953 133.666938)">response, never repeat the</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(824.612797 144.373813)">effect</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f3a5f" x="835.2" y="262.870313" transform="rotate(-0 835.2 262.870313)">Unresolved</text>
   </g>
   <g id="text_16">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(791.095422 282.416297)">some, all or none of the</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(786.499328 292.066937)">effect may have occurred;</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(814.611234 302.056938)">investigate</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f3a5f" x="655.2" y="344.798437" transform="rotate(-0 655.2 344.798437)">Compensated or superseded</text>
   </g>
   <g id="text_18">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(600.09775 364.876937)">a separately governed follow-</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(606.771047 374.866937)">up; both chains preserved</text>
   </g>
   <g id="text_19">
    <text style="font-style: italic; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #5b6773" transform="translate(198.539672 421.797687)">Before dispatch, Gate rechecks expiry, revocation, policy activation and target preconditions. Required-recording failure stops new</text>
    <text style="font-style: italic; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #5b6773" transform="translate(330.532766 432.867687)">dispatch. Compensation is a new action with its own authorization.</text>
   </g>
  </g>
 </g>
