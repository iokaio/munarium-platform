   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f3a5f" x="468" y="34.136484" transform="rotate(-0 468 34.136484)">ENFORCEMENT MODES</text>
   </g>
   <g id="text_2">
    <text style="font-style: italic; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #5b6773" x="468" y="58.628145" transform="rotate(-0 468 58.628145)">A separate dimension from the adoption stage; every record identifies the mode that actually applied</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="112.32" y="101.559844" transform="rotate(-0 112.32 101.559844)">OBSERVE</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a8863b" x="41.76" y="130.192383" transform="rotate(-0 41.76 130.192383)">BEHAVIOR</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1c2a3a" x="41.76" y="146.230312" transform="rotate(-0 41.76 146.230312)">Records available traffic</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a8863b" x="41.76" y="187.796484" transform="rotate(-0 41.76 187.796484)">LIMIT</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(41.76 202.387875)">A mirrored request cannot</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(41.76 213.727875)">retroactively prevent an</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(41.76 225.881625)">effect</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="292.32" y="101.559844" transform="rotate(-0 292.32 101.559844)">ADVISE</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a8863b" x="221.76" y="130.192383" transform="rotate(-0 221.76 130.192383)">BEHAVIOR</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1c2a3a" x="221.76" y="145.358437" transform="rotate(-0 221.76 145.358437)">Computes shadow decisions</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a8863b" x="221.76" y="187.796484" transform="rotate(-0 221.76 187.796484)">LIMIT</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(221.76 202.387875)">Would-deny and would-</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(221.76 214.113094)">escalate are surfaced;</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(221.76 225.067875)">nothing is blocked</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="472.32" y="101.559844" transform="rotate(-0 472.32 101.559844)">GUARD</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a8863b" x="401.76" y="130.192383" transform="rotate(-0 401.76 130.192383)">BEHAVIOR</text>
   </g>
   <g id="text_15">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(401.76 146.230312)">Enforces a selected</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(401.76 157.508437)">boundary</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a8863b" x="401.76" y="187.796484" transform="rotate(-0 401.76 187.796484)">LIMIT</text>
   </g>
   <g id="text_17">
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(401.76 202.387875)">Meaningful only when the</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(401.76 213.727875)">capability is technically</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(401.76 225.881625)">behind the control</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="652.32" y="101.559844" transform="rotate(-0 652.32 101.559844)">ENFORCE</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a8863b" x="581.76" y="130.192383" transform="rotate(-0 581.76 130.192383)">BEHAVIOR</text>
   </g>
   <g id="text_20">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(581.76 146.230312)">Mediates the declared</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(581.76 157.508437)">consequential paths</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a8863b" x="581.76" y="187.796484" transform="rotate(-0 581.76 187.796484)">LIMIT</text>
   </g>
   <g id="text_22">
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(581.76 202.387875)">Fail closed; receipts for</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(581.76 213.727875)">every effect</text>
   </g>
   <g id="text_23">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="832.32" y="101.559844" transform="rotate(-0 832.32 101.559844)">ASSURE</text>
   </g>
   <g id="text_24">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a8863b" x="761.76" y="130.192383" transform="rotate(-0 761.76 130.192383)">BEHAVIOR</text>
   </g>
   <g id="text_25">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(761.76 145.358437)">Adds continuing evidence</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(761.76 157.508437)">and operational checks</text>
   </g>
   <g id="text_26">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a8863b" x="761.76" y="187.796484" transform="rotate(-0 761.76 187.796484)">LIMIT</text>
   </g>
   <g id="text_27">
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(761.76 202.387875)">Evidence packages and drift</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #1c2a3a" transform="translate(761.76 213.727875)">reporting</text>
   </g>
   <g id="text_28">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #1f3a5f" transform="translate(78.937148 287.771797)">Different agents and environments may run in different modes. Moving to weaker enforcement requires a governance transition and an updated</text>
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #1f3a5f" transform="translate(423.106562 301.554219)">assurance claim.</text>
   </g>
